[git_commit]
disabled = true

# The `when` scripts walk up the tree looking for .jj. That is far cheaper than
# running `jj root` (a process per module) on every prompt.
# `jj log --ignore-working-copy` does not snapshot, so the segment can lag
# behind file edits until the next jj command runs.
[custom.jj]
when = "d=$PWD; while [ -n \"$d\" ]; do [ -e \"$d/.jj\" ] && exit 0; d=${d%/*}; done; exit 1"
command = "jj log -r @ --no-graph --ignore-working-copy --color never -T 'separate(\" \", change_id.shortest(4), if(bookmarks, bookmarks.join(\",\")), if(conflict, \"conflict\"), if(divergent, \"divergent\"), if(empty, \"empty\"), if(description, description.first_line().substr(0, 28), \"(no desc)\"))'"
style = "italic purple"
format = "[$output]($style) "
shell = ["sh", "--norc", "--noprofile"]

# Native git modules, run via `starship module`, only outside jj repos.
[custom.git_branch]
when = "d=$PWD; while [ -n \"$d\" ]; do [ -e \"$d/.jj\" ] && exit 1; d=${d%/*}; done; exit 0"
command = "starship module git_branch"
style = ""
format = "$output"
require_repo = true
shell = ["sh", "--norc", "--noprofile"]

[custom.git_commit]
when = "d=$PWD; while [ -n \"$d\" ]; do [ -e \"$d/.jj\" ] && exit 1; d=${d%/*}; done; exit 0"
command = "starship module git_commit"
style = ""
format = "$output"
require_repo = true
shell = ["sh", "--norc", "--noprofile"]

[custom.git_status]
when = "d=$PWD; while [ -n \"$d\" ]; do [ -e \"$d/.jj\" ] && exit 1; d=${d%/*}; done; exit 0"
command = "starship module git_status"
style = ""
format = "$output"
require_repo = true
shell = ["sh", "--norc", "--noprofile"]
