# Get editor completions based on the config schema
"$schema" = 'https://starship.rs/config-schema.json'

# Inserts a blank line between shell prompts
add_newline = true
# Palette "Silver Point Accent" (see ~/.config/nvim/lua/plugins/teide.lua).
# Rex's Silver Point Dark maps every ANSI color to grey, so this palette
# overrides the color names that starship modules use with hex values.
palette = "silver_accent"
command_timeout = 200
# jj-aware prompt (https://github.com/jj-vcs/jj/wiki/Starship): in a jj repo
# (colocated included) show the jj change; elsewhere show the native git
# modules. Order matters, so the vcs modules are listed explicitly and $all
# fills in the rest.
format = "$username$hostname$localip$shlvl$singularity$kubernetes$nats$directory${custom.jj}${custom.git_branch}${custom.git_commit}$git_state${custom.git_status}$all"

[character]
error_symbol = "[✗](bold red)"
success_symbol = "[❯](bold orange)"

[directory]
truncation_length = 2
truncation_symbol = "…/"
repo_root_style = "bold cyan"
repo_root_format = "[$repo_root]($repo_root_style)[$path]($style)[$read_only]($read_only_style) "
read_only = " 󰌾"

[git_branch]
# Disabled natively; re-added below as custom.git_branch so it can be hidden in jj repos.
disabled = true
format = "[$branch]($style) "
style = "italic purple"
# symbol = " "

[git_status]
disabled = true
format = '[$all_status]($style)'
style = "cyan"
ahead = "⇡${count} "
diverged = "⇕⇡${ahead_count}⇣${behind_count} "
behind = "⇣${count} "
conflicted = " "
up_to_date = " "
untracked = "? "
modified = " "
stashed = ""
staged = ""
renamed = ""
deleted = ""

