# Palette "Silver Point Accent" (see ~/.config/nvim/lua/plugins/teide.lua)
[mgr]
# NOTE: can be combined with tmTheme (sublime colorshceme file) for preview code highlight
# syntect_theme = "path/to/tmTheme"

cwd = { fg = "#898989", italic = true }

# Hovered
hovered = { bg = "#232323" }
preview_hovered = { bg = "#232323" }

# Find
find_keyword = { fg = "#131313", bg = "#d77757", bold = true }
find_position = { fg = "#6cb6ad", bg = "#1f3330", bold = true }

# Marker
marker_copied = { fg = "#4eba65", bg = "#4eba65" }
marker_cut = { fg = "#ff6b80", bg = "#ff6b80" }
marker_marked = { fg = "#af87ff", bg = "#af87ff" }
marker_selected = { fg = "#b1b9f9", bg = "#b1b9f9" }

# Count
count_copied = { fg = "#131313", bg = "#4eba65" }
count_cut = { fg = "#131313", bg = "#ff6b80" }
count_selected = { fg = "#131313", bg = "#b1b9f9" }

# Border
border_symbol = "│"
border_style = { fg = "#333333" }

# Tab
[tabs]
active = { fg = "#131313", bg = "#b1b9f9" }
inactive = { fg = "#b1b9f9", bg = "#2a2a2a" }

[mode]
normal_main = { fg = "#131313", bg = "#b1b9f9", bold = true }
normal_alt = { fg = "#b1b9f9", bg = "#2a2a2a" }

select_main = { fg = "#131313", bg = "#af87ff", bold = true }
select_alt = { fg = "#af87ff", bg = "#2a2a2a" }

unset_main = { fg = "#131313", bg = "#ffc107", bold = true }
unset_alt = { fg = "#ffc107", bg = "#2a2a2a" }

[status]
overall = { fg = "#b4b4b4", bg = "#131313" }
sep_left = { open = "", close = "" }
sep_right = { open = "", close = "" }

# Progress
progress_label = { fg = "#b4b4b4", bold = true }
progress_normal = { fg = "#b1b9f9", bg = "#232323" }
progress_error = { fg = "#ff6b80", bg = "#232323" }

# Permissions
perm_type = { fg = "#b1b9f9" }
perm_read = { fg = "#ffc107" }
perm_write = { fg = "#ff6b80" }
perm_exec = { fg = "#4eba65" }
perm_sep = { fg = "#474747" }

[pick]
border = { fg = "#333333" }
active = { fg = "#b4b4b4", bg = "#363636" }
inactive = { fg = "#b4b4b4" }

# Input
[input]
border = { fg = "#474747" }
title = { fg = "#474747" }
value = { fg = "#ffc107" }
selected = { bg = "#363636" }

# Completion
[cmp]
border = { fg = "#474747" }
active = { fg = "#b4b4b4", bg = "#363636" }
inactive = { fg = "#b4b4b4" }

icon_file = ""
icon_folder = ""
icon_command = ""

# Tasks
[tasks]
border = { fg = "#333333" }
title = { fg = "#333333" }
hovered = { fg = "#b4b4b4", bg = "#363636" }

# Which
[which]
cols = 3
mask = { bg = "#131313" }
cand = { fg = "#6cb6ad" }
rest = { fg = "#b1b9f9" }
desc = { fg = "#af87ff" }
separator = " ➜ "
separator_style = { fg = "#666666" }

# Confirm
[confirm]
border = { fg = "#474747" }
title = { fg = "#333333" }
content = {}
list = {}
btn_yes = { bg = "#363636" }
btn_no = {}
btn_labels = ["  [Y]es  ", "  (N)o  "]

# Spot
[spot]
border = { fg = "#333333" }
title = { fg = "#333333" }

# Notify
[notify]
title_info = { fg = "#6cb6ad" }
title_warn = { fg = "#ffc107" }
title_error = { fg = "#ff6b80" }

icon_error = ""
icon_warn = ""
icon_info = ""

# Help
[help]
on = { fg = "#4eba65" }
run = { fg = "#af87ff" }
desc = { fg = "#6cb6ad" }
hovered = { bg = "#232323" }
footer = { fg = "#b4b4b4", bg = "#1a1a1a" }

[filetype]

rules = [
  # Images
  { mime = "image/*", fg = "#ffc107" },

  # Media
  { mime = "{audio,video}/*", fg = "#af87ff" },

  # Archives
  { mime = "application/*zip", fg = "#ff6b80" },
  { mime = "application/x-{tar,bzip*,7z-compressed,xz,rar}", fg = "#ff6b80" },

  # Documents
  { mime = "application/{pdf,doc,rtf,vnd.*}", fg = "#6cb6ad" },

  # Empty files
  # { mime = "inode/x-empty", fg = "#ff6b80" },

  # Special files
  { name = "*", is = "orphan", bg = "#ff6b80" },
  { name = "*", is = "exec", fg = "#4eba65" },

  # Fallback
  { name = "*/", fg = "#b1b9f9" },
  { name = "*", fg = "#b4b4b4" },
]
